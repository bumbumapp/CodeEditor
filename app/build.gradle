plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
}

android {
    namespace "com.blacksquircle.ui"
    compileSdk 36

    defaultConfig {
        applicationId "com.bumbumapps.codeeditorpro"

        minSdk versions.minSdk
        targetSdk 36

        versionCode 4
        versionName "1.1.0"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // play = Google Play, hms = Huawei AppGallery (Huawei Ads / Petal, no Google Mobile Services).
    // Release uses the app's Petal slots (override with -PHMS_BANNER_ID=...); debug builds use Huawei's test slots.
    flavorDimensions = ['store']
    productFlavors {
        play {
            dimension 'store'
        }
        hms {
            dimension 'store'
            resValue 'string', 'hms_banner_id', (project.findProperty('HMS_BANNER_ID') ?: 'o1sjddpbil').toString()
            resValue 'string', 'hms_interstitial_id', (project.findProperty('HMS_INTERSTITIAL_ID') ?: 'a3hsu92c2e').toString()
            resValue 'string', 'hms_test_banner_id', 'testw6vs28auh3'
            resValue 'string', 'hms_test_interstitial_id', 'testb4znbuh3n2'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
        androidTest.java.srcDirs += 'src/androidTest/kotlin'
    }
    lint {
        abortOnError false
    }
    buildFeatures {
        buildConfig true
        resValues true
        viewBinding true
    }
}

dependencies {
    hmsImplementation 'com.huawei.hms:ads-lite:13.4.91.301'
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Core
    implementation library.kotlin
    implementation library.core
    implementation library.activity
    implementation library.fragment



    // UI
    implementation library.appcompat
    implementation library.materialdesign
    implementation library.materialdialogs_core

    // AAC
    implementation library.livedata
    implementation library.viewmodel
    implementation library.lifecycle

    // Coroutines
    implementation library.coroutines_core
    implementation library.coroutines_android

    // DI
    implementation library.hilt
    kapt library.hilt_compiler

    // Modules
    implementation project(':filesystems:filesystem-base')

    // Features
    implementation project(':features:feature-core')
    implementation project(':features:feature-editor')
    implementation project(':features:feature-explorer')
    implementation project(':features:feature-fonts')
    implementation project(':features:feature-settings')
    implementation project(':features:feature-themes')
    implementation project(':features:feature-ui')

    // Tests
    testImplementation testLibrary.junit

    androidTestImplementation androidTestLibrary.junit_ext
    androidTestImplementation androidTestLibrary.test_runner
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
